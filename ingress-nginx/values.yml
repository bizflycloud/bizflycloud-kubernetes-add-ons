## Stack name: ingress-nginx/ingress-nginx
## Ref: https://github.com/kubernetes/ingress-nginx/tree/helm-chart-4.12.1/charts/ingress-nginx/
##

controller:
  # Hardcoded replicaCount: 2 removed to prevent wiping live replicas on upgrade.
  # Live scaled replicas (e.g. 5) are preserved via upgrade_guard overlay.
  service:
    type: LoadBalancer

  ## Enable metrics for NGINX Ingress controller
  metrics:
    enabled: true
    service:
      servicePort: 10254

  podAnnotations:
    prometheus.io/port: "10254"
    prometheus.io/scrape: "true"
