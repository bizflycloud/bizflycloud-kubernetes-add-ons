{{- if .Values.bizflycloud.appCredId }}
apiVersion: v1
kind: Secret
metadata:
  name: bizflycloud-credentials
  namespace: karpenter
type: Opaque
stringData:
  api-url: {{ .Values.bizflycloud.apiUrl | quote }}
  region: {{ .Values.bizflycloud.region | quote }}
  auth-method: {{ .Values.bizflycloud.authMethod | quote }}
  app-cred-id: {{ .Values.bizflycloud.appCredId | quote }}
  app-cred-secret: {{ .Values.bizflycloud.appCredSecret | quote }}
  project-id: {{ .Values.bizflycloud.projectId | quote }}
  cluster-id: {{ .Values.cluster.id | quote }}
  cluster-token: {{ .Values.cluster.token | quote }}
  join-endpoint: {{ .Values.cluster.joinEndpoint | quote }}
  logEndpoint: {{ .Values.cluster.logEndpoint | quote }}
  kubernetes-version: {{ .Values.cluster.kubernetesVersion | quote }}
  network-id: {{ .Values.cluster.networkId | quote }}
{{- end }}
