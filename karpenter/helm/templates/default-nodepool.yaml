{{- if .Values.nodePool.create }}
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: {{ .Values.nodePool.name }}
spec:
  limits:
    cpu: "100"
    memory: 200Gi
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 30s
    budgets:
    - nodes: "1"
      reasons:
      - Empty
      - Underutilized
    # The provider reports Drifted=InstanceTypeNotFound for healthy nodes, and
    # Karpenter then replaces them in a loop (new VM, drain, repeat). Block drift
    # disruption until the provider is fixed.
    - nodes: "0"
      reasons:
      - Drifted
  template:
    spec:
      nodeClassRef:
        group: karpenter.bizflycloud.com
        kind: BizflyCloudNodeClass
        name: {{ .Values.nodeClass.name }}
      expireAfter: 720h
      {{- /*
      The Cilium operator taints a new node with agent-not-ready until the agent
      runs there. Karpenter only ignores that taint if it is listed as a startup
      taint; otherwise it sees the pending pods as unschedulable on the node it
      just launched for them and launches a second one. Clusters on kube-router
      have no cilium-config, so they get no such taint.
      */}}
      {{- $startupTaints := .Values.nodePool.startupTaints | default list }}
      {{- $ciliumConfig := lookup "v1" "ConfigMap" "kube-system" "cilium-config" }}
      {{- $ciliumData := $ciliumConfig.data | default dict }}
      {{- if eq (get $ciliumData "set-cilium-node-taints") "true" }}
      {{- $ciliumTaintKey := get $ciliumData "agent-not-ready-taint-key" | default "node.cilium.io/agent-not-ready" }}
      {{- $startupTaints = append $startupTaints (dict "key" $ciliumTaintKey "effect" "NoSchedule") }}
      {{- end }}
      {{- with $startupTaints }}
      startupTaints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      requirements:
      - key: kubernetes.io/arch
        operator: In
        values: ["amd64"]
      - key: karpenter.sh/capacity-type
        operator: In
        values: ["on-demand"]
      - key: karpenter.bizflycloud.com/node-category
        operator: In
        values:
          {{- toYaml .Values.nodePool.categories | nindent 10 }}
      # The provider does not register these labels as well-known, so Karpenter
      # drops every instance type unless the NodePool states them explicitly.
      - key: karpenter.bizflycloud.com/disk-type
        operator: In
        values:
          {{- toYaml .Values.nodeClass.diskTypes | nindent 10 }}
      - key: karpenter.bizflycloud.com/cpu-vendor
        operator: Exists
      - key: karpenter.bizflycloud.com/os-type
        operator: In
        values: ["ubuntu"]
      - key: topology.kubernetes.io/zone
        operator: In
        values:
          {{- toYaml .Values.nodeClass.zones | nindent 10 }}
{{- end }}
