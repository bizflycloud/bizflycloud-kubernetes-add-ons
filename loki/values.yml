## Stack name: grafana/loki-stack
## Ref: https://artifacthub.io/packages/helm/grafana/loki-stack/2.9.9
##

loki:
  enabled: true
  persistence:
    enabled: true
    accessModes: ["ReadWriteOnce"]
    size: 10Gi

promtail:
  enabled: true

grafana:
  enabled: false

fluent-bit:
  enabled: false

prometheus:
  enabled: false
